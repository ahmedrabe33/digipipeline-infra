---
- name: Configure Jenkins IAM role to push images to ECR in EKS region
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    # Jenkins EC2 instances are in this region
    jenkins_ec2_region: us-west-2

    # ECR exists with EKS cluster in this region
    ecr_region: us-east-1

    ecr_policy_name: JenkinsPushToEcrInEksRegionPolicy

  tasks:
    - name: Get AWS account ID
      ansible.builtin.command: >
        aws sts get-caller-identity
        --profile {{ aws_profile | default('default') }}
        --query Account
        --output text
      register: account_id
      changed_when: false

    - name: Collect Jenkins controller and agent IPs
      ansible.builtin.set_fact:
        jenkins_ips: >-
          {{
            (
              groups['jenkins_controller'] | default([]) +
              groups['jenkins_agents'] | default([])
            )
            | map('extract', hostvars, 'ansible_host')
            | list
          }}

    - name: Find IAM instance profile ARNs for Jenkins EC2 instances in us-west-2
      ansible.builtin.shell: |
        set -e

        IP="{{ item }}"

        ARN=$(aws ec2 describe-instances \
          --region "{{ jenkins_ec2_region }}" \
          --profile "{{ aws_profile | default('default') }}" \
          --filters "Name=ip-address,Values=$IP" \
          --query "Reservations[].Instances[].IamInstanceProfile.Arn" \
          --output text)

        if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
          ARN=$(aws ec2 describe-instances \
            --region "{{ jenkins_ec2_region }}" \
            --profile "{{ aws_profile | default('default') }}" \
            --filters "Name=private-ip-address,Values=$IP" \
            --query "Reservations[].Instances[].IamInstanceProfile.Arn" \
            --output text)
        fi

        echo "$ARN"
      args:
        executable: /bin/bash
      loop: "{{ jenkins_ips }}"
      register: profile_arns
      changed_when: false

    - name: Set unique instance profile ARNs
      ansible.builtin.set_fact:
        unique_profile_arns: >-
          {{
            profile_arns.results
            | map(attribute='stdout')
            | reject('equalto', '')
            | reject('equalto', 'None')
            | unique
            | list
          }}

    - name: Show detected architecture
      ansible.builtin.debug:
        msg:
          - "Jenkins EC2 Region: {{ jenkins_ec2_region }}"
          - "EKS/ECR Region: {{ ecr_region }}"
          - "AWS Account ID: {{ account_id.stdout }}"
          - "Jenkins IPs: {{ jenkins_ips }}"
          - "Jenkins Instance Profiles: {{ unique_profile_arns }}"

    - name: Create ECR IAM policy document for us-east-1 ECR
      ansible.builtin.copy:
        dest: /tmp/jenkins-ecr-us-east-1-policy.json
        content: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "ECRAuth",
                "Effect": "Allow",
                "Action": [
                  "ecr:GetAuthorizationToken",
                  "ecr:DescribeRegistry"
                ],
                "Resource": "*"
              },
              {
                "Sid": "ECRRepoManagement",
                "Effect": "Allow",
                "Action": [
                  "ecr:DescribeRepositories",
                  "ecr:CreateRepository",
                  "ecr:PutLifecyclePolicy"
                ],
                "Resource": "arn:aws:ecr:{{ ecr_region }}:{{ account_id.stdout }}:repository/*"
              },
              {
                "Sid": "ECRPushPull",
                "Effect": "Allow",
                "Action": [
                  "ecr:BatchCheckLayerAvailability",
                  "ecr:InitiateLayerUpload",
                  "ecr:UploadLayerPart",
                  "ecr:CompleteLayerUpload",
                  "ecr:PutImage",
                  "ecr:BatchGetImage",
                  "ecr:GetDownloadUrlForLayer",
                  "ecr:DescribeImages",
                  "ecr:ListImages"
                ],
                "Resource": "arn:aws:ecr:{{ ecr_region }}:{{ account_id.stdout }}:repository/*"
              }
            ]
          }

    - name: Attach ECR policy to Jenkins IAM role
      ansible.builtin.shell: |
        set -e

        PROFILE_ARN="{{ item }}"
        PROFILE_NAME="${PROFILE_ARN##*/}"

        ROLE_NAME=$(aws iam get-instance-profile \
          --profile "{{ aws_profile | default('default') }}" \
          --instance-profile-name "$PROFILE_NAME" \
          --query "InstanceProfile.Roles[0].RoleName" \
          --output text)

        echo "Instance profile: $PROFILE_NAME"
        echo "Role name: $ROLE_NAME"

        aws iam put-role-policy \
          --profile "{{ aws_profile | default('default') }}" \
          --role-name "$ROLE_NAME" \
          --policy-name "{{ ecr_policy_name }}" \
          --policy-document file:///tmp/jenkins-ecr-us-east-1-policy.json
      args:
        executable: /bin/bash
      loop: "{{ unique_profile_arns }}"
      register: attach_result
      changed_when: true

    - name: Show attached policy result
      ansible.builtin.debug:
        var: attach_result.results | map(attribute='stdout_lines') | list
