---
- name: Configure kubeconfig for EKS
  hosts: dev
  gather_facts: false

  tasks:
    - name: Update kubeconfig
      ansible.builtin.command: >
        aws eks update-kubeconfig
        --region {{ aws_region }}
        --name {{ cluster_name }}
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.command: kubectl get nodes -o wide
      changed_when: false
