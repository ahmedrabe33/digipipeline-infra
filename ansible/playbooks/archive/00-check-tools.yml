---
- name: Check required local tools
  hosts: dev
  gather_facts: false

  tasks:
    - name: Check AWS CLI
      ansible.builtin.command: aws --version
      changed_when: false

    - name: Check kubectl
      ansible.builtin.command: kubectl version --client=true
      changed_when: false

    - name: Check Helm
      ansible.builtin.command: helm version --short
      changed_when: false

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - cluster_name != "CHANGE_ME"
          - aws_region != "CHANGE_ME"
        fail_msg: "Edit ansible/inventories/dev/group_vars/dev.yml and set cluster_name and aws_region first."
