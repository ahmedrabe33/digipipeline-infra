---
- name: Install AWS Load Balancer Controller
  hosts: dev
  gather_facts: false

  tasks:
    - name: Validate LBC variables
      ansible.builtin.assert:
        that:
          - vpc_id != "CHANGE_ME"
          - aws_lbc_role_arn | length > 0
        fail_msg: "To install LBC, set vpc_id and aws_lbc_role_arn in group_vars/dev.yml"
      when: install_lbc | bool

    - name: Install AWS Load Balancer Controller using Helm
      ansible.builtin.shell: |
        helm repo add eks https://aws.github.io/eks-charts || true
        helm repo update
        helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
          --namespace kube-system \
          --set clusterName={{ cluster_name }} \
          --set region={{ aws_region }} \
          --set vpcId={{ vpc_id }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set-string serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ aws_lbc_role_arn }}" \
          --wait \
          --timeout 10m
      args:
        executable: /bin/bash
      when: install_lbc | bool
