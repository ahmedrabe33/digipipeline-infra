---
- name: Rebuild Terraform infrastructure and update Ansible inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir | dirname | dirname }}"
    terraform_dir: "{{ project_root }}/infra/terraform"
    ansible_dir: "{{ project_root }}/ansible"

    aws_profile: "{{ lookup('env', 'AWS_PROFILE') | default('default', true) }}"
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
    jenkins_aws_region: "{{ lookup('env', 'JENKINS_AWS_REGION') | default('us-west-2', true) }}"

    key_name: "{{ lookup('env', 'DIGIPIPELINE_KEY_NAME') | default('devops-ha-eks-bastion-key', true) }}"
    key_path: "{{ lookup('env', 'DIGIPIPELINE_KEY_PATH') | default(lookup('env', 'HOME') ~ '/.ssh/' ~ key_name ~ '.pem', true) }}"
    public_key_path: "{{ lookup('env', 'DIGIPIPELINE_PUBLIC_KEY_PATH') | default(key_path ~ '.pub', true) }}"

    # Reusable project settings
    project_name: "{{ lookup('env', 'DIGIPIPELINE_PROJECT_NAME') | default('digipipeline', true) }}"
    environment_name: "{{ lookup('env', 'DIGIPIPELINE_ENVIRONMENT_NAME') | default('development', true) }}"
    app_name: "{{ lookup('env', 'DIGIPIPELINE_APP_NAME') | default('auraweb', true) }}"
    app_namespace: "{{ lookup('env', 'DIGIPIPELINE_APP_NAMESPACE') | default(app_name ~ '-dev', true) }}"
    app_ingress_name: "{{ lookup('env', 'DIGIPIPELINE_APP_INGRESS_NAME') | default(app_name ~ '-ingress', true) }}"
    app_secret_name: "{{ lookup('env', 'DIGIPIPELINE_APP_SECRET_NAME') | default('app-secrets', true) }}"

    app_repo_url: "{{ lookup('env', 'DIGIPIPELINE_APP_REPO_URL') | default('https://github.com/ahmedrabe33/digipipeline-app.git', true) }}"
    gitops_repo_url: "{{ lookup('env', 'DIGIPIPELINE_GITOPS_REPO_URL') | default('https://github.com/ahmedrabe33/digipipeline-gitops.git', true) }}"
    gitops_branch: "{{ lookup('env', 'DIGIPIPELINE_GITOPS_BRANCH') | default('main', true) }}"
    gitops_app_path: "{{ lookup('env', 'DIGIPIPELINE_GITOPS_APP_PATH') | default('k8s/overlays/development', true) }}"

    argocd_app_name: "{{ lookup('env', 'DIGIPIPELINE_ARGOCD_APP_NAME') | default(project_name ~ '-' ~ environment_name, true) }}"
    argocd_project: "{{ lookup('env', 'DIGIPIPELINE_ARGOCD_PROJECT') | default('default', true) }}"

    jenkins_job_name: "{{ lookup('env', 'DIGIPIPELINE_JENKINS_JOB_NAME') | default(project_name, true) }}"
    github_credentials_id: "{{ lookup('env', 'DIGIPIPELINE_GITHUB_CREDENTIALS_ID') | default('github-pat-creds', true) }}"

    ecr_repository_name: "{{ lookup('env', 'DIGIPIPELINE_ECR_REPOSITORY_NAME') | default('digipipeline-app', true) }}"

    sonar_project_key: "{{ lookup('env', 'DIGIPIPELINE_SONAR_PROJECT_KEY') | default(app_name, true) }}"
    sonar_project_name: "{{ lookup('env', 'DIGIPIPELINE_SONAR_PROJECT_NAME') | default(app_name ~ ' Platform', true) }}"

    enable_db_schema_automation: "{{ lookup('env', 'DIGIPIPELINE_ENABLE_DB_SCHEMA_AUTOMATION') | default('true', true) }}"
    postgres_db: "{{ lookup('env', 'DIGIPIPELINE_POSTGRES_DB') | default(app_name, true) }}"
    postgres_user: "{{ lookup('env', 'DIGIPIPELINE_POSTGRES_USER') | default(app_name, true) }}"
    postgres_password: "{{ lookup('env', 'DIGIPIPELINE_POSTGRES_PASSWORD') | default(app_name ~ '_password', true) }}"

  tasks:
    - name: Check local SSH private key exists
      ansible.builtin.stat:
        path: "{{ key_path }}"
      register: bastion_key

    - name: Stop if SSH private key is missing
      ansible.builtin.fail:
        msg: "Missing SSH key: {{ key_path }}"
      when: not bastion_key.stat.exists

    - name: Ensure local SSH public key exists for Terraform
      ansible.builtin.shell: |
        set -e
        ssh-keygen -y -f "{{ key_path }}" > "{{ public_key_path }}"
        chmod 644 "{{ public_key_path }}"
      args:
        executable: /bin/bash

    - name: Ensure terraform.tfvars exists
      ansible.builtin.copy:
        src: "{{ terraform_dir }}/terraform.tfvars.example"
        dest: "{{ terraform_dir }}/terraform.tfvars"
        force: false

    - name: Get AWS account ID
      ansible.builtin.command: >
        aws sts get-caller-identity
        --profile {{ aws_profile }}
        --query Account
        --output text
      register: account_id_output
      changed_when: false

    - name: Check AWS EC2 key pair in main region
      ansible.builtin.command: >
        aws ec2 describe-key-pairs
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --key-names {{ key_name }}
      register: keypair_check
      changed_when: false
      failed_when: false

    - name: Import EC2 key pair in main region if missing
      ansible.builtin.shell: |
        set -e
        aws ec2 import-key-pair \
          --region {{ aws_region }} \
          --profile {{ aws_profile }} \
          --key-name {{ key_name }} \
          --public-key-material fileb://{{ public_key_path }}
      args:
        executable: /bin/bash
      when: keypair_check.rc != 0

    - name: Check AWS EC2 key pair in Jenkins region
      ansible.builtin.command: >
        aws ec2 describe-key-pairs
        --region {{ jenkins_aws_region }}
        --profile {{ aws_profile }}
        --key-names {{ key_name }}
      register: jenkins_keypair_check
      changed_when: false
      failed_when: false

    - name: Get current public IP
      ansible.builtin.shell: curl -s https://checkip.amazonaws.com | tr -d '\n'
      register: my_public_ip
      changed_when: false

    - name: Update aws_region in terraform.tfvars
      ansible.builtin.lineinfile:
        path: "{{ terraform_dir }}/terraform.tfvars"
        regexp: '^aws_region\s*='
        line: 'aws_region = "{{ aws_region }}"'

    - name: Update jenkins_aws_region in terraform.tfvars
      ansible.builtin.lineinfile:
        path: "{{ terraform_dir }}/terraform.tfvars"
        regexp: '^jenkins_aws_region\s*='
        line: 'jenkins_aws_region = "{{ jenkins_aws_region }}"'

    - name: Update my_ip_cidr in terraform.tfvars
      ansible.builtin.lineinfile:
        path: "{{ terraform_dir }}/terraform.tfvars"
        regexp: '^my_ip_cidr\s*='
        line: 'my_ip_cidr = "{{ my_public_ip.stdout }}/32"'

    - name: Update key_name in terraform.tfvars
      ansible.builtin.lineinfile:
        path: "{{ terraform_dir }}/terraform.tfvars"
        regexp: '^key_name\s*='
        line: 'key_name = "{{ key_name }}"'

    - name: Update public_key_path in terraform.tfvars
      ansible.builtin.lineinfile:
        path: "{{ terraform_dir }}/terraform.tfvars"
        regexp: '^public_key_path\s*='
        line: 'public_key_path = "{{ public_key_path }}"'

    - name: Update ECR repository names in terraform.tfvars
      ansible.builtin.replace:
        path: "{{ terraform_dir }}/terraform.tfvars"
        regexp: '(?ms)^ecr_repository_names\s*=\s*\[.*?\]'
        replace: |-
          ecr_repository_names = [
            "{{ ecr_repository_name }}"
          ]

    - name: Terraform init
      ansible.builtin.command: terraform init -reconfigure
      args:
        chdir: "{{ terraform_dir }}"

    - name: Import Jenkins key pair into Terraform state if it already exists in AWS
      ansible.builtin.shell: |
        set -e
        terraform state show module.jenkins.aws_key_pair.jenkins >/dev/null 2>&1 || \
        terraform import module.jenkins.aws_key_pair.jenkins "{{ key_name }}"
      args:
        chdir: "{{ terraform_dir }}"
        executable: /bin/bash
      when: jenkins_keypair_check.rc == 0

    - name: Terraform fmt
      ansible.builtin.command: terraform fmt -recursive
      args:
        chdir: "{{ terraform_dir }}"

    - name: Terraform validate
      ansible.builtin.command: terraform validate
      args:
        chdir: "{{ terraform_dir }}"

    - name: Terraform apply
      ansible.builtin.command: terraform apply -auto-approve -no-color
      args:
        chdir: "{{ terraform_dir }}"

    - name: Read Terraform outputs as JSON
      ansible.builtin.command: terraform output -json
      args:
        chdir: "{{ terraform_dir }}"
      register: tf_output
      changed_when: false

    - name: Set Terraform output facts
      ansible.builtin.set_fact:
        tf: "{{ tf_output.stdout | from_json }}"
        aws_account_id: "{{ account_id_output.stdout }}"
        cluster_name: "{{ (tf_output.stdout | from_json).cluster_name.value }}"

    - name: Ensure Ansible inventory directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_dir }}/inventories/dev"
        - "{{ ansible_dir }}/inventories/dev/group_vars"

    - name: Update Ansible hosts.ini with new Bastion and Jenkins hosts
      ansible.builtin.copy:
        dest: "{{ ansible_dir }}/inventories/dev/hosts.ini"
        content: |
          [bastion]
          devops-bastion ansible_host={{ tf.bastion_public_ip.value }} ansible_user=ubuntu ansible_ssh_private_key_file={{ key_path }}

          [jenkins_controller]
          jenkins-controller ansible_host={{ tf.jenkins_controller_public_ip.value }} ansible_user=ec2-user ansible_ssh_private_key_file={{ key_path }}

          [jenkins_agents]
          {% for ip in tf.jenkins_agent_private_ips.value %}
          jenkins-agent-{{ loop.index }} ansible_host={{ ip }} ansible_user=ec2-user ansible_ssh_private_key_file={{ key_path }} ansible_ssh_common_args='-o ProxyJump=ec2-user@{{ tf.jenkins_controller_public_ip.value }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          {% endfor %}

    - name: Update Ansible all.yml with new Terraform outputs and reusable settings
      ansible.builtin.copy:
        dest: "{{ ansible_dir }}/inventories/dev/group_vars/all.yml"
        content: |
          # ==================================================
          # Reusable Project Settings
          # Change this section when using another application
          # ==================================================

          project_name: "{{ project_name }}"
          environment_name: "{{ environment_name }}"

          app_name: "{{ app_name }}"
          app_namespace: "{{ app_namespace }}"
          app_ingress_name: "{{ app_ingress_name }}"
          app_secret_name: "{{ app_secret_name }}"

          app_repo_url: "{{ app_repo_url }}"
          gitops_repo_url: "{{ gitops_repo_url }}"
          gitops_branch: "{{ gitops_branch }}"
          gitops_app_path: "{{ gitops_app_path }}"

          argocd_namespace: "argocd"
          argocd_project: "{{ argocd_project }}"
          argocd_app_name: "{{ argocd_app_name }}"

          jenkins_job_name: "{{ jenkins_job_name }}"
          github_credentials_id: "{{ github_credentials_id }}"

          sonar_project_key: "{{ sonar_project_key }}"
          sonar_project_name: "{{ sonar_project_name }}"
          sonar_jenkins_credential_id: "sonarqube-token"

          enable_db_schema_automation: {{ enable_db_schema_automation | bool }}
          postgres_pod: "postgres-0"
          postgres_db: "{{ postgres_db }}"
          postgres_user: "{{ postgres_user }}"
          postgres_password: "{{ postgres_password }}"

          jwt_secret: "dev-jwt-secret-123456"

          redis_host: "redis"
          redis_port: "6379"
          redis_url: "redis://redis:6379"

          rabbitmq_host: "rabbitmq"
          rabbitmq_port: "5672"
          rabbitmq_user: "guest"
          rabbitmq_password: "guest"
          rabbitmq_url: "amqp://guest:guest@rabbitmq:5672"

          # ==================================================
          # AWS / Terraform Generated Values
          # These values are generated/updated by automation
          # ==================================================

          aws_profile: "{{ aws_profile }}"
          aws_region: "{{ aws_region }}"
          jenkins_aws_region: "{{ jenkins_aws_region }}"
          aws_account_id: "{{ aws_account_id }}"

          cluster_name: "{{ tf.cluster_name.value }}"
          vpc_id: "{{ tf.vpc_id.value }}"

          bastion_public_ip: "{{ tf.bastion_public_ip.value }}"
          bastion_private_ip: "{{ tf.bastion_private_ip.value }}"
          bastion_key_path: "{{ key_path }}"

          ecr_repository_name: "{{ ecr_repository_name }}"
          ecr_repository_url: "{{ tf.ecr_repository_urls.value[ecr_repository_name] }}"

          jenkins_url: "{{ tf.jenkins_url.value }}"
          jenkins_controller_public_ip: "{{ tf.jenkins_controller_public_ip.value }}"
          jenkins_controller_private_ip: "{{ tf.jenkins_controller_private_ip.value }}"
          jenkins_agent_private_ips:
          {% for ip in tf.jenkins_agent_private_ips.value %}
            - "{{ ip }}"
          {% endfor %}

          aws_lbc_policy_name: "AWSLoadBalancerControllerIAMPolicy-{{ tf.cluster_name.value }}"
          aws_lbc_role_name: "AmazonEKSLoadBalancerControllerRole-{{ tf.cluster_name.value }}"
          aws_lbc_namespace: "kube-system"
          aws_lbc_service_account_name: "aws-load-balancer-controller"

          karpenter_namespace: "kube-system"
          karpenter_service_account_name: "karpenter"
          karpenter_controller_role_arn: "{{ tf.karpenter_controller_role_arn.value }}"
          karpenter_node_role_name: "{{ tf.karpenter_node_role_name.value }}"
          karpenter_ec2nodeclass_name: "default"
          karpenter_nodepool_name: "default"

    - name: Add new Bastion to temporary inventory
      ansible.builtin.add_host:
        name: devops-bastion
        groups:
          - bastion
          - runtime_bastion
        ansible_host: "{{ tf.bastion_public_ip.value }}"
        ansible_connection: ssh
        ansible_user: ubuntu
        ansible_ssh_user: ubuntu
        ansible_remote_user: ubuntu
        ansible_ssh_private_key_file: "{{ key_path }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
        ansible_python_interpreter: /usr/bin/python3

    - name: Wait for SSH on Bastion
      ansible.builtin.wait_for:
        host: "{{ tf.bastion_public_ip.value }}"
        port: 22
        timeout: 300
        delay: 10
      delegate_to: localhost

    - name: Wait for Ansible connection to Bastion
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
      delegate_to: devops-bastion
      remote_user: ubuntu

    - name: Wait for Bastion user_data tools
      ansible.builtin.shell: |
        set -e
        command -v aws
        command -v kubectl
      args:
        executable: /bin/bash
      register: bastion_tools
      changed_when: false
      retries: 30
      delay: 10
      until: bastion_tools.rc == 0
      delegate_to: devops-bastion
      remote_user: ubuntu

    - name: Configure kubeconfig on Bastion
      ansible.builtin.shell: |
        set -e
        echo "USER=$(whoami)"
        echo "HOME=$HOME"

        mkdir -p "$HOME/.kube"

        aws eks update-kubeconfig \
          --region {{ aws_region }} \
          --name {{ cluster_name }} \
          --alias {{ cluster_name }} \
          --kubeconfig "$HOME/.kube/config"

        chmod 700 "$HOME/.kube"
        chmod 600 "$HOME/.kube/config"

        kubectl --kubeconfig "$HOME/.kube/config" config current-context
      args:
        executable: /bin/bash
      register: kubeconfig_result
      changed_when: false
      delegate_to: devops-bastion
      remote_user: ubuntu

    - name: Show kubeconfig user
      ansible.builtin.debug:
        var: kubeconfig_result.stdout_lines

    - name: Verify EKS nodes from Bastion
      ansible.builtin.shell: |
        set -e
        echo "USER=$(whoami)"
        echo "HOME=$HOME"
        timeout 30s kubectl --kubeconfig "$HOME/.kube/config" get nodes -o wide
      args:
        executable: /bin/bash
      register: eks_nodes
      changed_when: false
      retries: 12
      delay: 10
      until: eks_nodes.rc == 0
      delegate_to: devops-bastion
      remote_user: ubuntu

    - name: Show EKS nodes
      ansible.builtin.debug:
        var: eks_nodes.stdout_lines

    - name: Show next command
      ansible.builtin.debug:
        msg:
          - "Infrastructure is ready."
          - "Bastion IP: {{ tf.bastion_public_ip.value }}"
          - "App repo: {{ app_repo_url }}"
          - "GitOps repo: {{ gitops_repo_url }}"
          - "ECR repository: {{ ecr_repository_name }}"
          - "Next: cd {{ ansible_dir }} && ansible-playbook playbooks/10-install-platform.yml"
