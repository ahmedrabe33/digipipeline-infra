---
# Master playbook for DigiPipeline
# Run from local machine only:
# cd ~/digipipeline-workspace/digipipeline-infra/ansible
#
# Normal run without rebuilding Terraform:
# ansible-playbook playbooks/99-run-all-digipipeline.yml
#
# Full infrastructure rebuild:
# ansible-playbook playbooks/99-run-all-digipipeline.yml --tags infra
#
# Run only platform:
# ansible-playbook playbooks/99-run-all-digipipeline.yml --tags platform
#
# Run only app/GitOps:
# ansible-playbook playbooks/99-run-all-digipipeline.yml --tags app
#
# Run only CI/Jenkins:
# ansible-playbook playbooks/99-run-all-digipipeline.yml --tags ci
#
# Run only DevSecOps:
# ansible-playbook playbooks/99-run-all-digipipeline.yml --tags devsecops
#
# Open dashboards only:
# ansible-playbook playbooks/99-run-all-digipipeline.yml --tags access

# 1. Keys
- import_playbook: 00-ensure-keypairs.yml
  tags:
    - keys
    - infra
    - all

# 2. Infrastructure rebuild
# Disabled by default for safety.
# Runs only when using: --tags infra
- import_playbook: 00-rebuild-infra.yml
  tags:
    - never
    - infra

# 3. Verify cluster access
- import_playbook: 00-verify-cluster.yml
  tags:
    - verify
    - cluster
    - platform
    - all

# 4. Kubernetes platform
# Expected to include:
# 00-verify-cluster.yml
# 04-install-ebs-csi-driver.yml
# 04-configure-default-storageclass.yml
# 01-install-argocd.yml
# 03-install-aws-load-balancer-controller.yml
# 06-install-karpenter.yml
# 09-install-monitoring.yml
# 00-verify-cluster.yml
- import_playbook: 10-install-platform.yml
  tags:
    - platform
    - cluster
    - ebs
    - storage
    - argocd
    - alb
    - karpenter
    - monitoring
    - all

# 5. Argo CD password/info
- import_playbook: 02-argocd-password.yml
  tags:
    - argocd
    - access
    - info
    - all

# 6. App secrets
# Must run before GitOps workloads.
# Creates DB_NAME, DB_USER, DB_PASSWORD, RabbitMQ, Redis, JWT, and URLs.
- import_playbook: 13-create-app-secrets.yml
  tags:
    - secrets
    - app
    - gitops
    - platform
    - all

# 7. Bootstrap GitOps app
# This creates the Argo CD Application and deploys the workloads.
- import_playbook: 11-bootstrap-gitops-app.yml
  tags:
    - gitops
    - app
    - argocd
    - all

# 8. Apply database schema fixes
# Must run after GitOps app because postgres-0 must exist first.
- import_playbook: 14-apply-db-schema.yml
  tags:
    - db
    - schema
    - app
    - gitops
    - platform
    - all

# 9. CI / Jenkins
# Expected to include:
# 20-install-jenkins-controller.yml
# 21-prepare-jenkins-agents.yml
# 22-show-ci-info.yml
- import_playbook: 30-install-ci.yml
  tags:
    - ci
    - jenkins
    - all

# 10. Jenkins GitHub plugins
- import_playbook: 29-install-jenkins-github-plugins.yml
  tags:
    - ci
    - jenkins
    - plugins
    - github
    - all

# 11. Jenkins ECR IAM
- import_playbook: 32-configure-jenkins-ecr-iam.yml
  tags:
    - ci
    - jenkins
    - ecr
    - iam
    - all

# 12. Jenkins agents
- import_playbook: 32-configure-jenkins-agents.yml
  tags:
    - ci
    - jenkins
    - agents
    - all

# 13. DevSecOps
# Expected to include:
# 24-install-sonarqube.yml
# 25-install-trivy.yml
# 27-verify-devsecops.yml
# 26-open-sonarqube-access.yml
- import_playbook: 31-install-devsecops.yml
  tags:
    - devsecops
    - sonarqube
    - trivy
    - all

# 14. Jenkins SonarQube plugin
- import_playbook: 28-install-jenkins-sonarqube-plugin.yml
  tags:
    - devsecops
    - sonarqube
    - jenkins
    - plugins
    - all

# 15. Configure Jenkins with SonarQube
- import_playbook: 27-setup-sonarqube-for-jenkins.yml
  tags:
    - devsecops
    - sonarqube
    - jenkins
    - all

# 16. Monitoring extra configuration
- import_playbook: 28-configure-prometheus.yml
  tags:
    - prometheus
    - monitoring
    - all

# 17. Show application/platform access info
- import_playbook: 12-show-access-info.yml
  tags:
    - info
    - access
    - all

# 18. Show Jenkins/ECR info
- import_playbook: 22-show-ci-info.yml
  tags:
    - info
    - ci
    - jenkins
    - all

# 19. Open dashboards
# Do not run by default because local ports may already be busy.
# Run only with: --tags access
- import_playbook: open-all-access.yml
  tags:
    - never
    - access