---
- name: Bootstrap DigiPipeline GitOps app in Argo CD
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    argocd_namespace: "argocd"
    app_name: "digipipeline-development"
    app_namespace: "auraweb-dev"
    gitops_repo_url: "https://github.com/ahmedrabe33/digipipeline-gitops.git"
    gitops_target_revision: "main"
    gitops_app_path: "k8s/overlays/development"

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - aws_region is defined
          - cluster_name is defined
        fail_msg: "Missing required variables. Run 00-rebuild-infra.yml first."

    - name: Update kubeconfig on Bastion
      ansible.builtin.shell: |
        set -e

        mkdir -p "$HOME/.kube"

        aws eks update-kubeconfig \
          --region "{{ aws_region }}" \
          --name "{{ cluster_name }}" \
          --alias "{{ cluster_name }}" \
          --kubeconfig "$HOME/.kube/config"

        chmod 700 "$HOME/.kube"
        chmod 600 "$HOME/.kube/config"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Delete old demo app from Argo CD
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          delete application demo-app --ignore-not-found=true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Create target namespace
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" \
          create namespace "{{ app_namespace }}" \
          --dry-run=client -o yaml \
        | kubectl --kubeconfig "$HOME/.kube/config" apply -f -
      args:
        executable: /bin/bash

    - name: Create DigiPipeline Argo CD Application manifest
      ansible.builtin.copy:
        dest: /tmp/digipipeline-development-application.yaml
        mode: "0644"
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {{ app_name }}
            namespace: {{ argocd_namespace }}
          spec:
            project: default
            source:
              repoURL: {{ gitops_repo_url }}
              targetRevision: {{ gitops_target_revision }}
              path: {{ gitops_app_path }}
            destination:
              server: https://kubernetes.default.svc
              namespace: {{ app_namespace }}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true

    - name: Apply DigiPipeline Argo CD Application
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" \
          apply -f /tmp/digipipeline-development-application.yaml
      args:
        executable: /bin/bash
      register: app_apply

    - name: Show apply result
      ansible.builtin.debug:
        var: app_apply.stdout_lines

    - name: Show Argo CD applications
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          get applications
      args:
        executable: /bin/bash
      register: argo_apps
      changed_when: false

    - name: Print Argo CD applications
      ansible.builtin.debug:
        var: argo_apps.stdout_lines
