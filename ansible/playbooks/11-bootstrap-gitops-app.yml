---
- name: Bootstrap GitOps application in Argo CD
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    kubeconfig: "$HOME/.kube/config"

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - aws_region is defined
          - cluster_name is defined
          - app_namespace is defined
          - gitops_repo_url is defined
          - gitops_branch is defined
          - gitops_app_path is defined
          - argocd_namespace is defined
          - argocd_project is defined
          - argocd_app_name is defined
        fail_msg: "Missing reusable project variables. Check inventories/dev/group_vars/all.yml."

    - name: Update kubeconfig on Bastion
      ansible.builtin.shell: |
        set -e

        mkdir -p "$HOME/.kube"

        aws eks update-kubeconfig \
          --region "{{ aws_region }}" \
          --name "{{ cluster_name }}" \
          --alias "{{ cluster_name }}" \
          --kubeconfig "{{ kubeconfig }}"

        chmod 700 "$HOME/.kube"
        chmod 600 "{{ kubeconfig }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Delete old demo app from Argo CD if exists
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ argocd_namespace }}" \
          delete application demo-app --ignore-not-found=true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Create target application namespace
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          create namespace "{{ app_namespace }}" \
          --dry-run=client -o yaml \
        | kubectl --kubeconfig "{{ kubeconfig }}" apply -f -
      args:
        executable: /bin/bash

    - name: Create Argo CD Application manifest
      ansible.builtin.copy:
        dest: "/tmp/{{ argocd_app_name }}-application.yaml"
        mode: "0644"
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: "{{ argocd_app_name }}"
            namespace: "{{ argocd_namespace }}"
          spec:
            project: "{{ argocd_project }}"
            source:
              repoURL: "{{ gitops_repo_url }}"
              targetRevision: "{{ gitops_branch }}"
              path: "{{ gitops_app_path }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ app_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true

    - name: Apply Argo CD Application
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          apply -f "/tmp/{{ argocd_app_name }}-application.yaml"
      args:
        executable: /bin/bash
      register: app_apply

    - name: Show apply result
      ansible.builtin.debug:
        var: app_apply.stdout_lines

    - name: Show Argo CD applications
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ argocd_namespace }}" \
          get applications
      args:
        executable: /bin/bash
      register: argo_apps
      changed_when: false

    - name: Print Argo CD applications
      ansible.builtin.debug:
        var: argo_apps.stdout_lines
