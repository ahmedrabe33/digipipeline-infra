---
- name: Bootstrap demo app from digipipeline-gitops and print access info
  hosts: bastion
  gather_facts: false

  vars:
    app_name: "demo-app"
    app_namespace: "demo-app"
    app_ingress_name: "demo-app-ingress"
    gitops_repo_url: "https://github.com/ahmedrabe33/digipipeline-gitops.git"
    gitops_app_path: "apps/demo-app"

  tasks:
    - name: Create Argo CD Application manifest
      ansible.builtin.copy:
        dest: /tmp/demo-app-application.yaml
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {{ app_name }}
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: {{ gitops_repo_url }}
              targetRevision: main
              path: {{ gitops_app_path }}
            destination:
              server: https://kubernetes.default.svc
              namespace: {{ app_namespace }}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true

    - name: Apply Argo CD Application
      ansible.builtin.command: kubectl apply -f /tmp/demo-app-application.yaml
      register: app_apply
      changed_when: "'created' in app_apply.stdout or 'configured' in app_apply.stdout"

    - name: Wait for app namespace
      ansible.builtin.command: kubectl get namespace {{ app_namespace }}
      changed_when: false
      register: ns_check
      retries: 30
      delay: 10
      until: ns_check.rc == 0

    - name: Wait for app deployment rollout
      ansible.builtin.command: kubectl -n {{ app_namespace }} rollout status deployment/{{ app_name }} --timeout=300s
      changed_when: false

    - name: Wait for ALB hostname
      ansible.builtin.shell: |
        kubectl -n {{ app_namespace }} get ingress {{ app_ingress_name }} \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
      register: alb_hostname
      changed_when: false
      retries: 30
      delay: 20
      until: alb_hostname.stdout | length > 0

    - name: Get Argo CD admin password
      ansible.builtin.shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret \
          -o jsonpath='{.data.password}' | base64 -d
      register: argocd_password
      changed_when: false

    - name: Get Grafana admin password
      ansible.builtin.shell: |
        kubectl -n monitoring get secret kube-prometheus-stack-grafana \
          -o jsonpath='{.data.admin-password}' | base64 -d
      register: grafana_password
      changed_when: false

    - name: Show final access information
      ansible.builtin.debug:
        msg:
          - "APP URL: http://{{ alb_hostname.stdout }}"
          - "ARGO CD URL: https://localhost:8080"
          - "ARGO CD USERNAME: admin"
          - "ARGO CD PASSWORD: {{ argocd_password.stdout }}"
          - "GRAFANA URL: http://localhost:3000"
          - "GRAFANA USERNAME: admin"
          - "GRAFANA PASSWORD: {{ grafana_password.stdout }}"
          - "SSH TUNNEL COMMAND:"
          - "ssh -i {{ bastion_key_path }} -L 8080:localhost:8080 -L 3000:localhost:3000 ubuntu@{{ bastion_public_ip }}"
          - "RUN ON BASTION FOR ARGO CD:"
          - "kubectl port-forward svc/argocd-server -n argocd 8080:443"
          - "RUN ON BASTION FOR GRAFANA:"
          - "kubectl port-forward -n monitoring svc/kube-prometheus-stack-grafana 3000:80"
