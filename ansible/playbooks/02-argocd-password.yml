---
- name: Get Argo CD admin password
  hosts: bastion
  gather_facts: false

  vars:
    argocd_namespace: argocd
    argocd_secret_name: argocd-initial-admin-secret

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - aws_region is defined
          - cluster_name is defined
        fail_msg: "Missing aws_region or cluster_name. Run 00-rebuild-infra.yml first."

    - name: Check required tools on Bastion
      ansible.builtin.shell: |
        set -e
        command -v aws
        command -v kubectl
      args:
        executable: /bin/bash
      changed_when: false

    - name: Update kubeconfig on Bastion
      ansible.builtin.shell: |
        set -e

        mkdir -p "$HOME/.kube"

        aws eks update-kubeconfig \
          --region "{{ aws_region }}" \
          --name "{{ cluster_name }}" \
          --alias "{{ cluster_name }}" \
          --kubeconfig "$HOME/.kube/config"

        chmod 700 "$HOME/.kube"
        chmod 600 "$HOME/.kube/config"

        kubectl --kubeconfig "$HOME/.kube/config" config current-context
      args:
        executable: /bin/bash
      register: kubeconfig_output
      changed_when: false

    - name: Show kubeconfig context
      ansible.builtin.debug:
        var: kubeconfig_output.stdout_lines

    - name: Check Argo CD namespace exists
      ansible.builtin.shell: |
        set -e
        kubectl --kubeconfig "$HOME/.kube/config" get namespace "{{ argocd_namespace }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for Argo CD initial admin secret
      ansible.builtin.shell: |
        set -e
        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          get secret "{{ argocd_secret_name }}"
      args:
        executable: /bin/bash
      register: argocd_secret_check
      changed_when: false
      retries: 12
      delay: 10
      until: argocd_secret_check.rc == 0
      failed_when: false

    - name: Stop if initial admin secret is missing
      ansible.builtin.fail:
        msg:
          - "Argo CD initial admin secret was not found."
          - "This can happen if the admin password was already changed or the secret was deleted."
          - "Secret: {{ argocd_secret_name }}"
          - "Namespace: {{ argocd_namespace }}"
      when: argocd_secret_check.rc != 0

    - name: Get initial admin password
      ansible.builtin.shell: |
        set -e
        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          get secret "{{ argocd_secret_name }}" \
          -o jsonpath="{.data.password}" | base64 -d
        echo
      args:
        executable: /bin/bash
      register: argocd_password
      changed_when: false

    - name: Show Argo CD login info
      ansible.builtin.debug:
        msg:
          - "URL after port-forward: https://localhost:8080"
          - "Username: admin"
          - "Password: {{ argocd_password.stdout }}"
          - "Port-forward command from Bastion: kubectl --kubeconfig $HOME/.kube/config -n argocd port-forward svc/argocd-server 8080:443 --address 0.0.0.0"
