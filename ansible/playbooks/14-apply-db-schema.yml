---
- name: Apply optional application database schema fixes
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    kubeconfig: "$HOME/.kube/config"

  tasks:
    - name: Show DB schema automation status
      ansible.builtin.debug:
        msg:
          - "DB schema automation enabled: {{ enable_db_schema_automation | bool }}"
          - "Application namespace: {{ app_namespace }}"
          - "Postgres pod: {{ postgres_pod }}"

    - name: Skip DB schema automation when disabled
      ansible.builtin.debug:
        msg: "Skipping DB schema automation because enable_db_schema_automation is false."
      when: not (enable_db_schema_automation | bool)

    - name: Wait for Postgres pod to be ready
      ansible.builtin.shell: |
        set -e

        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ app_namespace }}" \
          wait --for=condition=Ready pod/{{ postgres_pod }} \
          --timeout=300s
      args:
        executable: /bin/bash
      changed_when: false
      when: enable_db_schema_automation | bool

    - name: Apply AuraWeb-compatible users and sessions schema
      ansible.builtin.shell: |
        set -e

        cat <<'SQL' | kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ app_namespace }}" \
          exec -i "{{ postgres_pod }}" -- sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
        CREATE TABLE IF NOT EXISTS public.users (
          id SERIAL PRIMARY KEY,
          email VARCHAR(255) UNIQUE NOT NULL,
          password_hash TEXT,
          name VARCHAR(255),
          first_name VARCHAR(255) DEFAULT '',
          last_name VARCHAR(255) DEFAULT '',
          role VARCHAR(50) DEFAULT 'user',
          is_active BOOLEAN DEFAULT true,
          email_verified BOOLEAN DEFAULT false,
          created_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW(),
          updated_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW(),
          last_login TIMESTAMP WITHOUT TIME ZONE
        );

        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS password_hash TEXT;
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS name VARCHAR(255);
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS first_name VARCHAR(255) DEFAULT '';
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS last_name VARCHAR(255) DEFAULT '';
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS role VARCHAR(50) DEFAULT 'user';
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS is_active BOOLEAN DEFAULT true;
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS email_verified BOOLEAN DEFAULT false;
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS created_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW();
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS updated_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW();
        ALTER TABLE public.users ADD COLUMN IF NOT EXISTS last_login TIMESTAMP WITHOUT TIME ZONE;

        CREATE UNIQUE INDEX IF NOT EXISTS users_email_key ON public.users (email);

        CREATE TABLE IF NOT EXISTS public.sessions (
          id SERIAL PRIMARY KEY,
          user_id INTEGER REFERENCES public.users(id) ON DELETE CASCADE,
          refresh_token TEXT,
          expires_at TIMESTAMP WITHOUT TIME ZONE,
          ip_address VARCHAR(100),
          user_agent TEXT,
          created_at TIMESTAMP WITHOUT TIME ZONE DEFAULT NOW()
        );
        SQL
      args:
        executable: /bin/bash
      changed_when: false
      when: enable_db_schema_automation | bool

    - name: Verify users table schema
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ app_namespace }}" \
          exec "{{ postgres_pod }}" -- sh -lc \
          'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "\d users"'
      args:
        executable: /bin/bash
      register: users_schema
      changed_when: false
      when: enable_db_schema_automation | bool

    - name: Print users table schema
      ansible.builtin.debug:
        var: users_schema.stdout_lines
      when: enable_db_schema_automation | bool
