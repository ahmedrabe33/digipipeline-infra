---
- name: Create reusable application secrets
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    kubeconfig: "$HOME/.kube/config"

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - app_namespace is defined
          - app_secret_name is defined
          - postgres_db is defined
          - postgres_user is defined
          - postgres_password is defined
          - jwt_secret is defined
          - redis_host is defined
          - redis_port is defined
          - redis_url is defined
          - rabbitmq_host is defined
          - rabbitmq_port is defined
          - rabbitmq_user is defined
          - rabbitmq_password is defined
          - rabbitmq_url is defined
        fail_msg: "Missing application secret variables. Check inventories/dev/group_vars/all.yml."

    - name: Ensure application namespace exists
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          create namespace "{{ app_namespace }}" \
          --dry-run=client -o yaml \
        | kubectl --kubeconfig "{{ kubeconfig }}" apply -f -
      args:
        executable: /bin/bash

    - name: Create or update application secrets
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ app_namespace }}" \
          create secret generic "{{ app_secret_name }}" \
          --from-literal=DB_NAME="{{ postgres_db }}" \
          --from-literal=DB_USER="{{ postgres_user }}" \
          --from-literal=DB_PASSWORD="{{ postgres_password }}" \
          --from-literal=DB_HOST="postgres" \
          --from-literal=DB_PORT="5432" \
          --from-literal=POSTGRES_DB="{{ postgres_db }}" \
          --from-literal=POSTGRES_USER="{{ postgres_user }}" \
          --from-literal=POSTGRES_PASSWORD="{{ postgres_password }}" \
          --from-literal=POSTGRES_HOST="postgres" \
          --from-literal=POSTGRES_PORT="5432" \
          --from-literal=DATABASE_URL="postgresql://{{ postgres_user }}:{{ postgres_password }}@postgres:5432/{{ postgres_db }}" \
          --from-literal=JWT_SECRET="{{ jwt_secret }}" \
          --from-literal=REDIS_HOST="{{ redis_host }}" \
          --from-literal=REDIS_PORT="{{ redis_port }}" \
          --from-literal=REDIS_URL="{{ redis_url }}" \
          --from-literal=RABBITMQ_HOST="{{ rabbitmq_host }}" \
          --from-literal=RABBITMQ_PORT="{{ rabbitmq_port }}" \
          --from-literal=RABBITMQ_USER="{{ rabbitmq_user }}" \
          --from-literal=RABBITMQ_PASS="{{ rabbitmq_password }}" \
          --from-literal=RABBITMQ_DEFAULT_USER="{{ rabbitmq_user }}" \
          --from-literal=RABBITMQ_DEFAULT_PASS="{{ rabbitmq_password }}" \
          --from-literal=RABBITMQ_URL="{{ rabbitmq_url }}" \
          --from-literal=AMQP_URL="{{ rabbitmq_url }}" \
          --dry-run=client -o yaml \
        | kubectl --kubeconfig "{{ kubeconfig }}" apply -f -
      args:
        executable: /bin/bash
      register: app_secret_result

    - name: Show secret apply result
      ansible.builtin.debug:
        var: app_secret_result.stdout_lines

    - name: Verify application secret exists
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ app_namespace }}" \
          get secret "{{ app_secret_name }}"
      args:
        executable: /bin/bash
      register: app_secret_check
      changed_when: false

    - name: Print application secret
      ansible.builtin.debug:
        var: app_secret_check.stdout_lines
