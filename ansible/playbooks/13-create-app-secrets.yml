---
- name: Create application secrets for DigiPipeline
  hosts: bastion
  gather_facts: false

  vars:
    kubeconfig: "$HOME/.kube/config"
    app_namespace: "auraweb-dev"

    postgres_db: "auraweb"
    postgres_user: "auraweb"
    postgres_password: "auraweb_password"

    jwt_secret: "dev-jwt-secret-123456"

    redis_host: "redis"
    redis_port: "6379"
    redis_url: "redis://redis:6379"

    rabbitmq_host: "rabbitmq"
    rabbitmq_port: "5672"
    rabbitmq_user: "guest"
    rabbitmq_password: "guest"
    rabbitmq_url: "amqp://guest:guest@rabbitmq:5672"

  tasks:
    - name: Ensure application namespace exists
      ansible.builtin.shell: |
        set -e

        kubectl --kubeconfig "{{ kubeconfig }}" create namespace "{{ app_namespace }}" \
          --dry-run=client -o yaml | kubectl --kubeconfig "{{ kubeconfig }}" apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Create or update app-secrets
      ansible.builtin.shell: |
        set -e

        kubectl --kubeconfig "{{ kubeconfig }}" -n "{{ app_namespace }}" create secret generic app-secrets \
          --from-literal=DB_NAME="{{ postgres_db }}" \
          --from-literal=DB_USER="{{ postgres_user }}" \
          --from-literal=DB_PASSWORD="{{ postgres_password }}" \
          --from-literal=DB_HOST="postgres" \
          --from-literal=DB_PORT="5432" \
          --from-literal=POSTGRES_DB="{{ postgres_db }}" \
          --from-literal=POSTGRES_USER="{{ postgres_user }}" \
          --from-literal=POSTGRES_PASSWORD="{{ postgres_password }}" \
          --from-literal=POSTGRES_HOST="postgres" \
          --from-literal=POSTGRES_PORT="5432" \
          --from-literal=DATABASE_URL="postgresql://{{ postgres_user }}:{{ postgres_password }}@postgres:5432/{{ postgres_db }}" \
          --from-literal=JWT_SECRET="{{ jwt_secret }}" \
          --from-literal=REDIS_HOST="{{ redis_host }}" \
          --from-literal=REDIS_PORT="{{ redis_port }}" \
          --from-literal=REDIS_URL="{{ redis_url }}" \
          --from-literal=RABBITMQ_HOST="{{ rabbitmq_host }}" \
          --from-literal=RABBITMQ_PORT="{{ rabbitmq_port }}" \
          --from-literal=RABBITMQ_USER="{{ rabbitmq_user }}" \
          --from-literal=RABBITMQ_PASS="{{ rabbitmq_password }}" \
          --from-literal=RABBITMQ_DEFAULT_USER="{{ rabbitmq_user }}" \
          --from-literal=RABBITMQ_DEFAULT_PASS="{{ rabbitmq_password }}" \
          --from-literal=RABBITMQ_URL="{{ rabbitmq_url }}" \
          --from-literal=AMQP_URL="{{ rabbitmq_url }}" \
          --dry-run=client -o yaml | kubectl --kubeconfig "{{ kubeconfig }}" apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify app-secrets exists
      ansible.builtin.shell: |
        set -e

        kubectl --kubeconfig "{{ kubeconfig }}" -n "{{ app_namespace }}" get secret app-secrets
      args:
        executable: /bin/bash
      register: app_secret_check
      changed_when: false

    - name: Show app-secrets result
      ansible.builtin.debug:
        var: app_secret_check.stdout_lines

    - name: Show app-secrets keys
      ansible.builtin.shell: |
        set -e

        kubectl --kubeconfig "{{ kubeconfig }}" -n "{{ app_namespace }}" get secret app-secrets -o jsonpath='{.data}' \
          | tr ',' '\n' \
          | sed 's/[{}"]//g' \
          | awk -F: '{print $1}' \
          | sort
      args:
        executable: /bin/bash
      register: app_secret_keys
      changed_when: false

    - name: Print app-secrets keys
      ansible.builtin.debug:
        var: app_secret_keys.stdout_lines