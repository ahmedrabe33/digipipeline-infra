---
- name: Install Karpenter on private EKS through Bastion
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  tasks:
    - name: Update kubeconfig on Bastion
      ansible.builtin.command: >
        aws eks update-kubeconfig
        --region {{ aws_region }}
        --name {{ cluster_name }}
      changed_when: false

    - name: Install or upgrade Karpenter with Helm
      ansible.builtin.shell: |
        helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
          --namespace {{ karpenter_namespace }} \
          --create-namespace \
          --set settings.clusterName={{ cluster_name }} \
          --set serviceAccount.name={{ karpenter_service_account_name }} \
          --set-string 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn={{ karpenter_controller_role_arn }}' \
          --set controller.resources.requests.cpu=500m \
          --set controller.resources.requests.memory=512Mi \
          --set controller.resources.limits.cpu=1 \
          --set controller.resources.limits.memory=1Gi \
          --wait \
          --timeout 10m
      args:
        executable: /bin/bash
      register: karpenter_install

    - name: Show Karpenter Helm result
      ansible.builtin.debug:
        var: karpenter_install.stdout_lines

    - name: Wait for Karpenter rollout
      ansible.builtin.command: >
        kubectl -n {{ karpenter_namespace }}
        rollout status deployment/karpenter
        --timeout=300s
      changed_when: false

    - name: Create EC2NodeClass and NodePool
      ansible.builtin.shell: |
        cat <<MANIFEST | kubectl apply -f -
        apiVersion: karpenter.k8s.aws/v1
        kind: EC2NodeClass
        metadata:
          name: {{ karpenter_ec2nodeclass_name }}
        spec:
          amiSelectorTerms:
            - alias: al2023@latest
          role: {{ karpenter_node_role_name }}
          subnetSelectorTerms:
            - tags:
                karpenter.sh/discovery: {{ cluster_name }}
          securityGroupSelectorTerms:
            - tags:
                karpenter.sh/discovery: {{ cluster_name }}
        ---
        apiVersion: karpenter.sh/v1
        kind: NodePool
        metadata:
          name: {{ karpenter_nodepool_name }}
        spec:
          template:
            metadata:
              labels:
                nodepool: karpenter
            spec:
              nodeClassRef:
                group: karpenter.k8s.aws
                kind: EC2NodeClass
                name: {{ karpenter_ec2nodeclass_name }}
              requirements:
                - key: kubernetes.io/arch
                  operator: In
                  values: ["amd64"]
                - key: kubernetes.io/os
                  operator: In
                  values: ["linux"]
                - key: karpenter.sh/capacity-type
                  operator: In
                  values: ["on-demand"]
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values: ["t3.medium", "t3.large"]
          limits:
            cpu: "4"
            memory: 8Gi
          disruption:
            consolidationPolicy: WhenEmptyOrUnderutilized
            consolidateAfter: 60s
        MANIFEST
      args:
        executable: /bin/bash
      register: karpenter_resources

    - name: Show Karpenter resources result
      ansible.builtin.debug:
        var: karpenter_resources.stdout_lines

    - name: Verify Karpenter pods
      ansible.builtin.command: kubectl -n {{ karpenter_namespace }} get pods -l app.kubernetes.io/name=karpenter -o wide
      changed_when: false
      register: karpenter_pods

    - name: Show Karpenter pods
      ansible.builtin.debug:
        var: karpenter_pods.stdout_lines

    - name: Verify NodePool and EC2NodeClass
      ansible.builtin.command: kubectl get nodepool,ec2nodeclass
      changed_when: false
      register: karpenter_objects

    - name: Show NodePool and EC2NodeClass
      ansible.builtin.debug:
        var: karpenter_objects.stdout_lines
