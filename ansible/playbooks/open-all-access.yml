---
- name: Start Kubernetes UI port-forwards on Bastion
  hosts: bastion
  gather_facts: false
  become: false

  vars:
    argocd_namespace: argocd
    monitoring_namespace: monitoring

    remote_argocd_port: 8081
    remote_grafana_port: 3001
    remote_prometheus_port: 9091

  tasks:
    - name: Verify Kubernetes access
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" get nodes
      args:
        executable: /bin/bash
      changed_when: false

    - name: Find Grafana service
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" -n "{{ monitoring_namespace }}" get svc \
          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.ports[*]}{.port}{","}{end}{"\n"}{end}' \
        | awk -F'|' '$1 ~ /grafana/ && $2 ~ /(^|,)80(,|$)/ {print $1; exit}'
      register: grafana_svc
      changed_when: false

    - name: Find Prometheus service
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" -n "{{ monitoring_namespace }}" get svc \
          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.ports[*]}{.port}{","}{end}{"\n"}{end}' \
        | awk -F'|' '$1 ~ /prometheus/ && $2 ~ /(^|,)9090(,|$)/ && $1 !~ /operator|alertmanager/ {print $1; exit}'
      register: prometheus_svc
      changed_when: false

    - name: Stop old kubectl port-forwards safely
      ansible.builtin.shell: |
        set +e
        ps -eo pid=,comm=,args= \
        | awk '$2=="kubectl" && /port-forward/ && /(argocd|monitoring)/ {print $1}' \
        | xargs -r kill -TERM
        sleep 2
        exit 0
      args:
        executable: /bin/bash
      changed_when: false

    - name: Start Argo CD port-forward on Bastion
      ansible.builtin.shell: |
        nohup kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          port-forward --address 127.0.0.1 \
          svc/argocd-server \
          "{{ remote_argocd_port }}:443" \
          > /tmp/argocd-port-forward.log 2>&1 &
      args:
        executable: /bin/bash

    - name: Start Grafana port-forward on Bastion
      ansible.builtin.shell: |
        nohup kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ monitoring_namespace }}" \
          port-forward --address 127.0.0.1 \
          "svc/{{ grafana_svc.stdout }}" \
          "{{ remote_grafana_port }}:80" \
          > /tmp/grafana-port-forward.log 2>&1 &
      args:
        executable: /bin/bash
      when: grafana_svc.stdout != ""

    - name: Start Prometheus port-forward on Bastion
      ansible.builtin.shell: |
        nohup kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ monitoring_namespace }}" \
          port-forward --address 127.0.0.1 \
          "svc/{{ prometheus_svc.stdout }}" \
          "{{ remote_prometheus_port }}:9090" \
          > /tmp/prometheus-port-forward.log 2>&1 &
      args:
        executable: /bin/bash
      when: prometheus_svc.stdout != ""

    - name: Wait for Argo CD on Bastion
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ remote_argocd_port }}"
        timeout: 60

    - name: Wait for Grafana on Bastion
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ remote_grafana_port }}"
        timeout: 60
      when: grafana_svc.stdout != ""

    - name: Wait for Prometheus on Bastion
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ remote_prometheus_port }}"
        timeout: 60
      when: prometheus_svc.stdout != ""


- name: Ensure Jenkins and SonarQube are running
  hosts: jenkins_controller
  become: true
  gather_facts: false

  tasks:
    - name: Start Jenkins and SonarQube containers
      ansible.builtin.shell: |
        docker start jenkins-controller || true
        docker start sonarqube || true
        sleep 20

        echo "==== Jenkins check ===="
        curl -I http://127.0.0.1:8080 || true

        echo "==== SonarQube check ===="
        curl -I http://127.0.0.1:9000 || true
      args:
        executable: /bin/bash

    - name: Wait for Jenkins
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 120

    - name: Wait for SonarQube
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        timeout: 120


- name: Open local SSH tunnels
  hosts: localhost
  gather_facts: false

  vars:
    local_argocd_port: 8080
    local_jenkins_port: 8082
    local_sonarqube_port: 9000
    local_grafana_port: 3000
    local_prometheus_port: 9090

    remote_argocd_port: 8081
    remote_grafana_port: 3001
    remote_prometheus_port: 9091

  tasks:
    - name: Set Bastion facts
      ansible.builtin.set_fact:
        bastion_host: "{{ hostvars[groups['bastion'][0]].ansible_host }}"
        bastion_user: "{{ hostvars[groups['bastion'][0]].ansible_user | default('ubuntu') }}"
        bastion_key: "{{ hostvars[groups['bastion'][0]].ansible_ssh_private_key_file }}"

    - name: Set Jenkins facts
      ansible.builtin.set_fact:
        jenkins_host: "{{ hostvars[groups['jenkins_controller'][0]].ansible_host }}"
        jenkins_user: "{{ hostvars[groups['jenkins_controller'][0]].ansible_user | default('ec2-user') }}"
        jenkins_key: "{{ hostvars[groups['jenkins_controller'][0]].ansible_ssh_private_key_file }}"

    - name: Free local ports safely
      ansible.builtin.shell: |
        set +e
        fuser -k 8080/tcp >/dev/null 2>&1 || true
        fuser -k 8082/tcp >/dev/null 2>&1 || true
        fuser -k 9000/tcp >/dev/null 2>&1 || true
        fuser -k 3000/tcp >/dev/null 2>&1 || true
        fuser -k 9090/tcp >/dev/null 2>&1 || true
        sleep 2
        exit 0
      args:
        executable: /bin/bash
      changed_when: false

    - name: Open Bastion tunnels
      ansible.builtin.shell: |
        ssh -f -N \
          -o ExitOnForwardFailure=yes \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o IdentitiesOnly=yes \
          -i "{{ bastion_key }}" \
          -L "{{ local_argocd_port }}:127.0.0.1:{{ remote_argocd_port }}" \
          -L "{{ local_grafana_port }}:127.0.0.1:{{ remote_grafana_port }}" \
          -L "{{ local_prometheus_port }}:127.0.0.1:{{ remote_prometheus_port }}" \
          "{{ bastion_user }}@{{ bastion_host }}"
      args:
        executable: /bin/bash

    - name: Open Jenkins tunnels
      ansible.builtin.shell: |
        ssh -f -N \
          -o ExitOnForwardFailure=yes \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o IdentitiesOnly=yes \
          -i "{{ jenkins_key }}" \
          -L "{{ local_jenkins_port }}:127.0.0.1:8080" \
          -L "{{ local_sonarqube_port }}:127.0.0.1:9000" \
          "{{ jenkins_user }}@{{ jenkins_host }}"
      args:
        executable: /bin/bash

    - name: Wait for local access
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 60
      loop:
        - "{{ local_argocd_port }}"
        - "{{ local_jenkins_port }}"
        - "{{ local_sonarqube_port }}"
        - "{{ local_grafana_port }}"
        - "{{ local_prometheus_port }}"

    - name: Show access information
      ansible.builtin.debug:
        msg:
          - "Argo CD: https://localhost:8080"
          - "Jenkins: http://localhost:8082"
          - "SonarQube: http://localhost:9000"
          - "Grafana: http://localhost:3000"
          - "Prometheus: http://localhost:9090"
          - "Grafana: admin / admin123"
          - "SonarQube: admin / Admin@12345"
