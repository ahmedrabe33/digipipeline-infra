---
- name: Start Kubernetes dashboard port-forwards on Bastion
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    argocd_namespace: argocd
    monitoring_namespace: monitoring
    argocd_local_port: 8080
    prometheus_local_port: 9090

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - aws_region is defined
          - cluster_name is defined
        fail_msg: "Missing aws_region or cluster_name. Run 00-rebuild-infra.yml first."

    - name: Check required tools on Bastion
      ansible.builtin.shell: |
        set -e
        command -v aws
        command -v kubectl
      args:
        executable: /bin/bash
      changed_when: false

    - name: Update kubeconfig on Bastion
      ansible.builtin.shell: |
        set -e

        mkdir -p "$HOME/.kube"

        aws eks update-kubeconfig \
          --region "{{ aws_region }}" \
          --name "{{ cluster_name }}" \
          --alias "{{ cluster_name }}" \
          --kubeconfig "$HOME/.kube/config"

        chmod 700 "$HOME/.kube"
        chmod 600 "$HOME/.kube/config"

        kubectl --kubeconfig "$HOME/.kube/config" config current-context
      args:
        executable: /bin/bash
      changed_when: false

    - name: Stop old Argo CD port-forward if exists
      ansible.builtin.shell: |
        pgrep -f "[k]ubectl.*port-forward.*argocd-server.*{{ argocd_local_port }}" | xargs -r kill || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Stop old Prometheus port-forward if exists
      ansible.builtin.shell: |
        pgrep -f "[k]ubectl.*port-forward.*{{ prometheus_local_port }}:9090" | xargs -r kill || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Start Argo CD port-forward on Bastion
      ansible.builtin.shell: |
        set -e

        nohup kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          port-forward svc/argocd-server "{{ argocd_local_port }}:443" \
          --address 127.0.0.1 \
          > /tmp/argocd-port-forward.log 2>&1 &

        sleep 5
      args:
        executable: /bin/bash
      changed_when: false

    - name: Find Prometheus service
      ansible.builtin.shell: |
        set -e

        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ monitoring_namespace }}" \
          get svc -o name | grep -E 'kube-prometheus-stack-prometheus|prometheus-operated' | head -n 1
      args:
        executable: /bin/bash
      register: prometheus_service
      changed_when: false

    - name: Start Prometheus port-forward on Bastion
      ansible.builtin.shell: |
        set -e

        nohup kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ monitoring_namespace }}" \
          port-forward "{{ prometheus_service.stdout }}" "{{ prometheus_local_port }}:9090" \
          --address 127.0.0.1 \
          > /tmp/prometheus-port-forward.log 2>&1 &

        sleep 5
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify Argo CD local port on Bastion
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ argocd_local_port }}"
        timeout: 60

    - name: Verify Prometheus local port on Bastion
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ prometheus_local_port }}"
        timeout: 60

    - name: Get Argo CD admin password if initial secret exists
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          get secret argocd-initial-admin-secret \
          -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null || true
      args:
        executable: /bin/bash
      register: argocd_password
      changed_when: false


- name: Get Jenkins access information
  hosts: jenkins_controller
  gather_facts: false
  become: true

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    jenkins_container_name: jenkins-controller

  tasks:
    - name: Check Jenkins container status
      ansible.builtin.shell: |
        docker ps -a --filter "name=^/{{ jenkins_container_name }}$" \
          --format "{{ '{{.Names}}' }} {{ '{{.Status}}' }}" 2>/dev/null || true
      args:
        executable: /bin/bash
      register: jenkins_status
      changed_when: false

    - name: Get Jenkins initial admin password if exists
      ansible.builtin.shell: |
        if docker exec "{{ jenkins_container_name }}" test -f /var/jenkins_home/secrets/initialAdminPassword 2>/dev/null; then
          docker exec "{{ jenkins_container_name }}" cat /var/jenkins_home/secrets/initialAdminPassword
        else
          echo "initial-password-not-found-or-jenkins-already-configured"
        fi
      args:
        executable: /bin/bash
      register: jenkins_password
      changed_when: false
      failed_when: false


- name: Open local SSH tunnels for Argo CD, Prometheus, and Jenkins
  hosts: localhost
  gather_facts: false

  vars:
    argocd_local_port: 8080
    prometheus_local_port: 9090
    jenkins_local_port: 8082

  tasks:
    - name: Set inventory host variables
      ansible.builtin.set_fact:
        bastion_host_name: "{{ groups['bastion'][0] }}"
        jenkins_host_name: "{{ groups['jenkins_controller'][0] }}"

    - name: Set access facts
      ansible.builtin.set_fact:
        bastion_ip: "{{ hostvars[bastion_host_name].ansible_host }}"
        jenkins_ip: "{{ hostvars[jenkins_host_name].ansible_host }}"
        bastion_key: "{{ hostvars[bastion_host_name].ansible_ssh_private_key_file }}"
        jenkins_key: "{{ hostvars[jenkins_host_name].ansible_ssh_private_key_file }}"

    - name: Check local Bastion SSH key exists
      ansible.builtin.stat:
        path: "{{ bastion_key }}"
      register: bastion_key_check

    - name: Check local Jenkins SSH key exists
      ansible.builtin.stat:
        path: "{{ jenkins_key }}"
      register: jenkins_key_check

    - name: Stop if local SSH keys are missing
      ansible.builtin.fail:
        msg:
          - "Missing SSH key."
          - "Bastion key: {{ bastion_key }}"
          - "Jenkins key: {{ jenkins_key }}"
      when: not bastion_key_check.stat.exists or not jenkins_key_check.stat.exists

    - name: Stop old local SSH tunnels if exists
      ansible.builtin.shell: |
        pgrep -f "[s]sh.*-L {{ argocd_local_port }}:localhost:{{ argocd_local_port }}" | xargs -r kill || true
        pgrep -f "[s]sh.*-L {{ prometheus_local_port }}:localhost:{{ prometheus_local_port }}" | xargs -r kill || true
        pgrep -f "[s]sh.*-L {{ jenkins_local_port }}:localhost:8080" | xargs -r kill || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Open local tunnel to Bastion for Argo CD and Prometheus
      ansible.builtin.shell: |
        ssh -f -N \
          -o ExitOnForwardFailure=yes \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o IdentitiesOnly=yes \
          -i "{{ bastion_key }}" \
          -L "{{ argocd_local_port }}:localhost:{{ argocd_local_port }}" \
          -L "{{ prometheus_local_port }}:localhost:{{ prometheus_local_port }}" \
          ubuntu@"{{ bastion_ip }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Open local tunnel to Jenkins
      ansible.builtin.shell: |
        ssh -f -N \
          -o ExitOnForwardFailure=yes \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o IdentitiesOnly=yes \
          -i "{{ jenkins_key }}" \
          -L "{{ jenkins_local_port }}:localhost:8080" \
          ec2-user@"{{ jenkins_ip }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify local Argo CD tunnel
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ argocd_local_port }}"
        timeout: 60

    - name: Verify local Prometheus tunnel
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ prometheus_local_port }}"
        timeout: 60

    - name: Verify local Jenkins tunnel
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ jenkins_local_port }}"
        timeout: 60

    - name: Show all access information
      ansible.builtin.debug:
        msg:
          - "ARGO CD URL: https://localhost:8080"
          - "ARGO CD USERNAME: admin"
          - "ARGO CD PASSWORD: {{ hostvars[bastion_host_name].argocd_password.stdout if hostvars[bastion_host_name].argocd_password.stdout | length > 0 else 'not-found-or-password-changed' }}"
          - "PROMETHEUS URL: http://localhost:9090"
          - "JENKINS LOCAL URL: http://localhost:8082"
          - "JENKINS DIRECT URL: http://{{ jenkins_ip }}:8080"
          - "JENKINS STATUS: {{ hostvars[jenkins_host_name].jenkins_status.stdout }}"
          - "JENKINS INITIAL PASSWORD: {{ hostvars[jenkins_host_name].jenkins_password.stdout }}"
          - "If Argo CD opens with a browser warning, click Advanced then Continue."
