---
- name: Show Digipipeline access information
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    app_namespace: demo-app
    app_ingress_name: demo-app-ingress
    argocd_namespace: argocd
    monitoring_namespace: monitoring
    grafana_secret_name: kube-prometheus-stack-grafana

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - aws_region is defined
          - cluster_name is defined
          - bastion_public_ip is defined
          - bastion_key_path is defined
        fail_msg: "Missing required variables. Run 00-rebuild-infra.yml first."

    - name: Check required tools on Bastion
      ansible.builtin.shell: |
        set -e
        command -v aws
        command -v kubectl
      args:
        executable: /bin/bash
      changed_when: false

    - name: Update kubeconfig on Bastion
      ansible.builtin.shell: |
        set -e

        mkdir -p "$HOME/.kube"

        aws eks update-kubeconfig \
          --region "{{ aws_region }}" \
          --name "{{ cluster_name }}" \
          --alias "{{ cluster_name }}" \
          --kubeconfig "$HOME/.kube/config"

        chmod 700 "$HOME/.kube"
        chmod 600 "$HOME/.kube/config"

        kubectl --kubeconfig "$HOME/.kube/config" config current-context
      args:
        executable: /bin/bash
      register: kubeconfig_output
      changed_when: false

    - name: Show kubeconfig context
      ansible.builtin.debug:
        var: kubeconfig_output.stdout_lines

    - name: Get app ALB hostname if exists
      ansible.builtin.shell: |
        set -e

        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ app_namespace }}" \
          get ingress "{{ app_ingress_name }}" \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true
      args:
        executable: /bin/bash
      register: alb_hostname
      changed_when: false

    - name: Get Argo CD admin password if initial secret exists
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ argocd_namespace }}" \
          get secret argocd-initial-admin-secret \
          -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null || true
      args:
        executable: /bin/bash
      register: argocd_password
      changed_when: false

    - name: Get Grafana admin password if monitoring exists
      ansible.builtin.shell: |
        kubectl --kubeconfig "$HOME/.kube/config" \
          -n "{{ monitoring_namespace }}" \
          get secret "{{ grafana_secret_name }}" \
          -o jsonpath='{.data.admin-password}' 2>/dev/null | base64 -d 2>/dev/null || true
      args:
        executable: /bin/bash
      register: grafana_password
      changed_when: false

    - name: Print access information
      ansible.builtin.debug:
        msg:
          - "APP URL: {{ 'http://' ~ alb_hostname.stdout if alb_hostname.stdout | length > 0 else 'not-ready-or-not-created-yet' }}"
          - "ARGO CD URL: https://localhost:8080"
          - "ARGO CD USERNAME: admin"
          - "ARGO CD PASSWORD: {{ argocd_password.stdout if argocd_password.stdout | length > 0 else 'not-found-or-password-changed' }}"
          - "GRAFANA URL: http://localhost:3000"
          - "GRAFANA USERNAME: admin"
          - "GRAFANA PASSWORD: {{ grafana_password.stdout if grafana_password.stdout | length > 0 else 'not-found' }}"
          - "To open Argo CD/Grafana from LOCAL, run:"
          - "cd ~/digipipeline-workspace/digipipeline-infra/ansible && ansible-playbook -i inventories/dev/hosts.ini playbooks/open-all-access.yml"
