---
- name: Show application and platform access information
  hosts: bastion
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  vars:
    kubeconfig: "$HOME/.kube/config"

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - app_namespace is defined
          - app_ingress_name is defined
          - argocd_namespace is defined
          - argocd_app_name is defined
        fail_msg: "Missing access variables. Check inventories/dev/group_vars/all.yml."

    - name: Get application Load Balancer hostname
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ app_namespace }}" \
          get ingress "{{ app_ingress_name }}" \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true
      args:
        executable: /bin/bash
      register: alb_hostname
      changed_when: false

    - name: Get Argo CD admin password
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ argocd_namespace }}" \
          get secret argocd-initial-admin-secret \
          -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true
      args:
        executable: /bin/bash
      register: argocd_password
      changed_when: false

    - name: Get Argo CD application status
      ansible.builtin.shell: |
        kubectl --kubeconfig "{{ kubeconfig }}" \
          -n "{{ argocd_namespace }}" \
          get application "{{ argocd_app_name }}" \
          -o jsonpath='Sync={.status.sync.status} Health={.status.health.status}' 2>/dev/null || true
      args:
        executable: /bin/bash
      register: argocd_app_status
      changed_when: false

    - name: Print platform access information
      ansible.builtin.debug:
        msg:
          - "================ DigiPipeline Access Info ================"
          - "PROJECT: {{ project_name | default('not-set') }}"
          - "ENVIRONMENT: {{ environment_name | default('not-set') }}"
          - "APP NAME: {{ app_name | default('not-set') }}"
          - "APP NAMESPACE: {{ app_namespace }}"
          - "APP INGRESS: {{ app_ingress_name }}"
          - "APP URL: {{ 'http://' ~ alb_hostname.stdout if alb_hostname.stdout | length > 0 else 'not-ready-or-not-created-yet' }}"
          - "ARGO CD URL: http://localhost:8080"
          - "ARGO CD USERNAME: admin"
          - "ARGO CD PASSWORD: {{ argocd_password.stdout if argocd_password.stdout | length > 0 else 'not-ready-or-not-created-yet' }}"
          - "ARGO CD APP: {{ argocd_app_name }}"
          - "ARGO CD STATUS: {{ argocd_app_status.stdout if argocd_app_status.stdout | length > 0 else 'not-ready-or-not-created-yet' }}"
          - "GRAFANA URL: http://localhost:3000"
          - "GRAFANA USERNAME: admin"
          - "GRAFANA PASSWORD: admin123"
          - "PROMETHEUS URL: http://localhost:9090"
          - "==========================================================="
