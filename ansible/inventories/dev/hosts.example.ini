[bastion]
devops-bastion ansible_host=X.X.X.X ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[jenkins_controller]
jenkins-controller ansible_host=X.X.X.X ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/your-key.pem

[jenkins_agents]
jenkins-agent-1 ansible_host=X.X.X.X ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/your-key.pem ansible_ssh_common_args='-o ProxyJump=ec2-user@54.200.156.97 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
jenkins-agent-2 ansible_host=X.X.X.X ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/your-key.pem ansible_ssh_common_args='-o ProxyJump=ec2-user@54.200.156.97 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
